<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Lasila veebileht on valmimas - ootame sind varsti tagasi!">
    <title>Lasila - Veebileht Valmimas</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            overflow-x: hidden;
        }

        /* Hero Section - Full Screen */
        .hero {
            position: relative;
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-image: url('https://www.genspark.ai/api/files/s/EhTmixmB');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }

        /* Dark Overlay for Text Readability */
        .hero::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.45);
            z-index: 1;
        }

        /* Content Container */
        .hero-content {
            position: relative;
            z-index: 2;
            text-align: center;
            color: white;
            padding: 0 20px;
            max-width: 800px;
            animation: fadeInUp 1s ease-out;
        }

        /* Logo/Site Name */
        .logo {
            font-family: 'Playfair Display', serif;
            font-size: clamp(3rem, 8vw, 6rem);
            font-weight: 700;
            margin-bottom: 1rem;
            letter-spacing: 2px;
            text-shadow: 2px 4px 8px rgba(0, 0, 0, 0.3);
        }

        /* Main Heading */
        .main-heading {
            font-size: clamp(1.8rem, 4vw, 3rem);
            font-weight: 600;
            margin-bottom: 1rem;
            text-shadow: 1px 2px 4px rgba(0, 0, 0, 0.3);
        }

        /* Subheading */
        .subheading {
            font-size: clamp(1.1rem, 2.5vw, 1.5rem);
            font-weight: 300;
            margin-bottom: 2.5rem;
            opacity: 0.95;
            text-shadow: 1px 2px 4px rgba(0, 0, 0, 0.3);
        }

        /* Footer */
        .footer {
            position: absolute;
            bottom: 0;
            width: 100%;
            padding: 20px;
            text-align: center;
            color: white;
            font-size: 0.95rem;
            z-index: 2;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.5);
        }

        /* Animations */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .hero {
                background-attachment: scroll;
            }

            .logo {
                margin-bottom: 0.5rem;
            }

            .main-heading {
                margin-bottom: 0.8rem;
            }

            .subheading {
                margin-bottom: 2rem;
            }

            .footer {
                font-size: 0.85rem;
            }
        }

        /* Loading Animation */
        .hero-content > * {
            animation-fill-mode: both;
        }

        .logo {
            animation-delay: 0.2s;
        }

        .main-heading {
            animation-delay: 0.4s;
        }

        .subheading {
            animation-delay: 0.6s;
        }
    </style>
</head>
<body>
    <!-- Hero Section -->
    <section class="hero">
        <div class="hero-content">
            <h1 class="logo">Lasila</h1>
            <h2 class="main-heading">Veebileht on valmimas</h2>
            <p class="subheading">Ootame sind varsti tagasi!</p>
        </div>
        
        <footer class="footer">
            © 2025 Lasila
        </footer>
    </section>
</body>
</html>
